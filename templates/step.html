<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ settings.site.step_title }}</title>
  <link rel="icon" href="/assets/{{ settings.site.favicon }}">
  <link rel="stylesheet" href="/static/style.css">

  <!-- Step page-এর জন্য আলাদা premium design; existing route/form logic অপরিবর্তিত -->
  <style>
    :root {
      color-scheme: dark;
      --step-bg: #070811;
      --step-panel: rgba(17, 19, 37, .88);
      --step-line: rgba(151, 133, 255, .22);
      --step-purple: #9b7bff;
      --step-cyan: #56e5ff;
      --step-text: #f4f2ff;
      --step-muted: #a7a8c5;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--step-text);
      background:
        radial-gradient(ellipse at 12% 8%, rgba(115, 75, 255, .19), transparent 34%),
        radial-gradient(ellipse at 92% 28%, rgba(28, 202, 255, .10), transparent 30%),
        linear-gradient(145deg, #070811 0%, #0b0c19 48%, #080912 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image: radial-gradient(rgba(190, 180, 255, .7) .65px, transparent .65px);
      background-size: 23px 23px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }

    .site-header {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 25px 0;
      border-bottom: 1px solid rgba(173, 162, 255, .12);
    }

    .brand a {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--step-text);
      text-decoration: none;
      font-size: 18px;
      font-weight: 850;
      letter-spacing: .08em;
    }

    .brand a::before {
      content: "A";
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(86, 229, 255, .55);
      border-radius: 12px;
      color: var(--step-cyan);
      background: linear-gradient(145deg, rgba(155, 123, 255, .22), rgba(86, 229, 255, .08));
      box-shadow: 0 0 24px rgba(86, 229, 255, .12), inset 0 0 15px rgba(155, 123, 255, .12);
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      width: 100%;
      padding: clamp(35px, 7vh, 76px) 16px 55px;
    }

    .panel {
      position: relative;
      width: 100%;
      max-width: 650px !important;
      padding: clamp(24px, 5vw, 42px) !important;
      overflow: hidden;
      border: 1px solid var(--step-line);
      border-radius: 25px;
      background: linear-gradient(145deg, rgba(24, 25, 49, .94), var(--step-panel));
      box-shadow: 0 25px 80px rgba(0, 0, 0, .42), 0 0 45px rgba(112, 83, 255, .08), inset 0 1px 0 rgba(255, 255, 255, .055);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: panel-in .65s cubic-bezier(.2,.8,.2,1) both;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      width: 76%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--step-cyan), var(--step-purple), transparent);
      opacity: .85;
    }

    .panel > div:not(.icon-badge) {
      color: var(--step-text);
      line-height: 1.75;
      overflow-wrap: anywhere;
    }

    .panel h1, .panel h2, .panel h3 {
      color: #fff;
      line-height: 1.25;
      letter-spacing: -.025em;
    }

    .panel p, .panel li {
      color: #c7c8df;
      line-height: 1.8;
    }

    .panel a {
      color: var(--step-cyan);
      text-underline-offset: 4px;
    }

    .panel ul, .panel ol { padding-left: 23px; }
    .panel li { padding-left: 4px; margin: 7px 0; }
    .panel li::marker { color: var(--step-purple); }

    .icon-badge {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin: 0 auto 22px;
      border-radius: 19px;
      font-size: 25px;
    }

    .icon-badge-error {
      color: #ff8caa;
      border: 1px solid rgba(255, 100, 145, .28);
      background: rgba(255, 74, 125, .10);
      box-shadow: 0 0 32px rgba(255, 74, 125, .10);
    }

    .error {
      color: #ffb2c5 !important;
      line-height: 1.7;
    }

    .btn {
      position: relative;
      min-height: 54px;
      margin-top: 22px !important;
      padding: 15px 22px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 15px;
      color: #080a17;
      background: linear-gradient(100deg, #a88bff 0%, #72cfff 52%, #68f0e3 100%);
      box-shadow: 0 10px 28px rgba(111, 133, 255, .22), inset 0 1px 0 rgba(255, 255, 255, .55);
      font: inherit;
      font-weight: 850;
      letter-spacing: .025em;
      cursor: pointer;
      transition: transform .2s ease, filter .2s ease, box-shadow .2s ease;
    }

    .btn:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(111, 133, 255, .32);
    }

    .btn:active { transform: translateY(0) scale(.99); }
    .btn:focus-visible, .brand a:focus-visible {
      outline: 2px solid var(--step-cyan);
      outline-offset: 4px;
    }

    @keyframes panel-in {
      from { opacity: 0; transform: translateY(14px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 480px) {
      .site-header { padding: 18px 0; }
      .brand a { font-size: 16px; }
      .container { padding: 34px 13px 38px; }
      .panel { border-radius: 21px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand"><a href="/">{{ settings.site.site_title }}</a></div>
  </header>

  <div class="container">
    <div class="panel" style="text-align:left; max-width:560px;">
      {% if disabled %}
        <div class="icon-badge icon-badge-error">✕</div>
        <p class="error" style="text-align:center;">This step is currently disabled. Please check back later.</p>
      {% else %}
        <div>{{ settings.step.rules_html | safe }}</div>
        <form method="POST" action="{{ url_for('step_continue') }}">
          <button type="submit" class="btn" style="width:100%; margin-top:12px;">Continue Step</button>
        </form>
      {% endif %}
    </div>
  </div>
</body>
</html>
